<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSOLSTAR Configurator</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;max-width:1200px;margin:auto;padding:20px}
.section{background:#1c1c1c;padding:20px;border-radius:12px;margin-bottom:20px}
input,textarea{width:100%;padding:10px;margin:6px 0 12px;border-radius:8px;border:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:#262626;border:2px solid #333;border-radius:12px;cursor:pointer;overflow:hidden}
.card.selected{border-color:#e11d48}
.card img{width:100%;height:180px;object-fit:cover}
.card h3,.card p{padding:0 12px}
.option{padding:8px 0}
.summary{background:#0f0f0f;padding:16px;border-radius:10px;white-space:pre-wrap}
.total{font-size:32px;color:#22c55e;font-weight:bold}
.actions{display:flex;gap:10px}.actions button{flex:1;padding:14px;border:none;border-radius:8px;color:#fff;font-weight:bold}.reset{background:#555}.submit{background:#cf1738}
</style>
</head>
<body>
<h1>INSOLSTAR Custom Vehicle Configurator</h1>
<form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST">
<input type="hidden" name="vehicle" id="vehicleName">
<input type="hidden" name="order_summary" id="orderSummaryField">
<div class="section"><h2>Customer Details</h2><input name="name" placeholder="Full Name" required><input type="email" name="email" placeholder="Email" required><input name="phone" placeholder="Phone / WhatsApp" required></div>
<div class="section"><h2>Select Vehicle</h2><div class="grid" id="vehicles">
<div class="card selected" data-name="Nine64 Turbo Junior" data-price="4500"><img src="images/nine64-junior.jpg"><h3>Nine64 Turbo Junior</h3><p>$4,500</p></div>
<div class="card" data-name="Nine64 Turbo Duo" data-price="5000"><img src="images/nine64-duo.jpg"><h3>Nine64 Turbo Duo</h3><p>$5,000</p></div>
<div class="card" data-name="F40 Gokart Junior" data-price="5000"><img src="images/f40.jpg"><h3>F40 Gokart Junior</h3><p>$5,000</p></div>
<div class="card" data-name="R34 Gokart Junior" data-price="5000"><img src="images/r34.jpg"><h3>R34 Gokart Junior</h3><p>$5,000</p></div>
<div class="card" data-name="AE8SIX Gokart Junior" data-price="4000"><img src="images/ae86.jpg"><h3>AE8SIX Gokart Junior</h3><p>$4,000</p></div>
<div class="card" data-name="FC RX7 Gokart Junior" data-price="4000"><img src="images/fcrx7.jpg"><h3>FC RX7 Gokart Junior</h3><p>$4,000</p></div>
</div></div>
<div class="section"><h2>Customization</h2>
<div class='option'><label><input type='checkbox' class='addon' data-name='Custom Paint' data-price='600'> Custom Paint (+$600)</label></div>
<div class='option'><label><input type='checkbox' class='addon' data-name='Racing Decal' data-price='600'> Racing Decal (+$600)</label></div>
<div class='option'><label><input type='checkbox' class='addon' data-name='Custom Wheels' data-price='1000'> Custom Wheels (+$1000)</label></div>
<div class='option'><label><input type='checkbox' class='addon' data-name='Custom Interior' data-price='1000'> Custom Interior (+$1000)</label></div>
<div class='option'><label><input type='checkbox' class='addon' data-name='Extra Battery' data-price='600'> Extra Battery (+$600)</label></div>
<div class='option'><label><input type='checkbox' class='addon' data-name='Duo Seating' data-price='1000'> Duo Seating (+$1000)</label></div>
<input name='paint_request' placeholder='Paint code or color request'><textarea name='notes' placeholder='Additional notes'></textarea>
<div class='total' id='total'>$4,500</div><div class='summary' id='summary'></div></div>
<div class='section'><h2>Verification</h2><div class='cf-turnstile' data-sitekey='YOUR_TURNSTILE_SITE_KEY'></div></div>
<div class='actions'><button type='reset' class='reset'>Reset</button><button type='submit' class='submit'>Submit Order Request</button></div>
</form>
<script>
let base=4500;const cards=document.querySelectorAll('.card');const addons=document.querySelectorAll('.addon');const total=document.getElementById('total');const summary=document.getElementById('summary');const vehicleField=document.getElementById('vehicleName');const summaryField=document.getElementById('orderSummaryField');
function update(){let t=base;let opts=[];addons.forEach(a=>{if(a.checked){t+=+a.dataset.price;opts.push(a.dataset.name)}});total.textContent='$'+t.toLocaleString();let txt='Vehicle: '+vehicleField.value+'
Options: '+(opts.join(', ')||'None')+'
Estimated Total: $'+t.toLocaleString();summary.textContent=txt;summaryField.value=txt;}
cards.forEach(c=>c.addEventListener('click',()=>{cards.forEach(x=>x.classList.remove('selected'));c.classList.add('selected');base=+c.dataset.price;vehicleField.value=c.dataset.name;update();}));
addons.forEach(a=>a.addEventListener('change',update));
document.querySelector('button[type=reset]').addEventListener('click',e=>{if(!confirm('Reset configuration?')){e.preventDefault();return;}setTimeout(()=>{cards.forEach(x=>x.classList.remove('selected'));cards[0].classList.add('selected');base=4500;vehicleField.value='Nine64 Turbo Junior';update();},0);});
vehicleField.value='Nine64 Turbo Junior';update();
</script>
</body></html>
