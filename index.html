<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Vehicle Configurator</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            max-width: 1200px;
            margin: auto;
            padding: 20px
        }

        .section {
            background: #1c1c1c;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px;
            border-radius: 8px;
            border: none
        }

        .grid {
            display: grid;
            grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px
        }

        .card {
            background: #262626;
            border: 2px solid #333;
            border-radius: 12px;
            cursor: pointer;
            overflow: hidden
        }

        .card.selected {
            border-color: #e11d48
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover
        }

        .card h3, .card p {
            padding: 0 12px
        }

        .option {
            padding: 8px 0
        }

        .summary {
            background: #0f0f0f;
            padding: 16px;
            border-radius: 10px;
            white-space: pre-wrap
        }

        .total {
            font-size: 32px;
            color: #22c55e;
            font-weight: bold
        }

        .actions {
            display: flex;
            gap: 10px
        }

        .actions button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold
        }

        .reset {
            background: #555
        }

        .submit {
            background: #cf1738
        }
    </style>
</head>
<body>
<h1>Custom Vehicle Configurator</h1>
<form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST">
    <input type="hidden" name="vehicle" id="vehicleName">
    <input type="hidden" name="order_summary" id="orderSummaryField">
    <div class="section"><h2>Customer Details</h2>
        <label>
            <input name="name" placeholder="Full Name" required>
        </label>
        <label>
            <input type="email" name="email" placeholder="Email" required>
        </label>
        <label>
            <input name="phone" placeholder="Phone / WhatsApp" required>
        </label>
    </div>
    <div class="section"><h2>Select Vehicle</h2>
        <div class="grid" id="vehicles">
            <div class="card" data-name="Porsche 911" data-price="175000"><img src="images/911.png" alt="Porsche 911">
                <h3>Porsche 911</h3>
                <p>R175,000</p></div>
            <div class="card" data-name="Ferrari F40" data-price="190000"><img src="images/ferrari_f40.png"
                                                                                 alt="Ferrari F40">
                <h3>Ferrari F40</h3>
                <p>R190,000</p></div>
            <div class="card" data-name="Nissan R34" data-price="190000"><img src="images/nissan_r34.png"
                                                                                alt="Nissan R34">
                <h3>Nissan R34</h3>
                <p>R190,000</p></div>
            <div class="card" data-name="Toyota AE86" data-price="155000"><img src="images/toyota_ae86.png"
                                                                                 alt="Toyota AE86">
                <h3>Toyota AE86</h3>
                <p>R155,000</p></div>
            <div class="card" data-name="Mazda RX7" data-price="155000"><img src="images/mazda_rx7.png"
                                                                               alt="Mazda RX7">
                <h3>Mazda RX7</h3>
                <p>R155,000</p></div>
        </div>
    </div>
    <div class="section"><h2>Customization</h2>
        <div class='option'><label><input type='checkbox' class='addon' data-name='Custom Paint' data-price='25000'>
            Custom Paint (+R25,000)</label></div>
        <div class='option'><label><input type='checkbox' class='addon' data-name='Racing Decal' data-price='25000'>
            Racing Decal (+R25,000)</label></div>
        <div class='option'><label><input type='checkbox' class='addon' data-name='Custom Wheels' data-price='40000'>
            Custom Wheels (+R40,000)</label></div>
        <div class='option'><label><input type='checkbox' class='addon' data-name='Custom Interior' data-price='40000'>
            Custom Interior (+R40,000)</label></div>
        <div class='option'><label><input type='checkbox' class='addon' data-name='Extra Battery' data-price='25000'>
            Extra Battery (+R25,000)</label></div>
        <div class='option'><label><input type='checkbox' class='addon' data-name='Duo Seating' data-price='40000'> Duo
            Seating (+R40,000)</label></div>
        <label>
            <input name='paint_request' placeholder='Paint code or color request'>
        </label><label>
<textarea name='notes'
          placeholder='Additional notes'></textarea>
        </label>
        <div class='total' id='total'>$4,500</div>
        <div class='summary' id='summary'></div>
    </div>
    <div class='section'><h2>Verification</h2>
        <div class='cf-turnstile' data-sitekey='YOUR_TURNSTILE_SITE_KEY'></div>
    </div>
    <div class='actions'>
        <button type='reset' class='reset'>Reset</button>
        <button type='submit' class='submit'>Submit Order Request</button>
    </div>
</form>
<script>
    let base = 4500;
    const cards = document.querySelectorAll('.card');
    const addons = document.querySelectorAll('.addon');
    const total = document.getElementById('total');
    const summary = document.getElementById('summary');
    const vehicleField = document.getElementById('vehicleName');
    const summaryField = document.getElementById('orderSummaryField');

    function update() {
        let t = base;
        let opts = [];
        addons.forEach(a => {
            if (a.checked) {
                t += +a.dataset.price;
                opts.push(a.dataset.name)
            }
        });
        total.textContent = 'R' + t.toLocaleString();
        let txt = 'Vehicle: ' + vehicleField.value + 'Options: ' + (opts.join(', ') || 'None') + 'EstimatedTotal: R' + t.toLocaleString();
        summary.textContent = txt;
        summaryField.value = txt;
    }

    cards.forEach(c => c.addEventListener('click', () => {
        cards.forEach(x => x.classList.remove('selected'));
        c.classList.add('selected');
        base = +c.dataset.price;
        vehicleField.value = c.dataset.name;
        update();
    }));
    addons.forEach(a => a.addEventListener('change', update));
    document.querySelector('button[type=reset]').addEventListener('click', e => {
        if (!confirm('Reset configuration?')) {
            e.preventDefault();
            return;
        }
        setTimeout(() => {
            cards.forEach(x => x.classList.remove('selected'));
            cards[0].classList.add('selected');
            base = 4500;
            vehicleField.value = 'Porsche 911';
            update();
        }, 0);
    });
    vehicleField.value = 'Porsche 911';
    update();
</script>
</body>
</html>
